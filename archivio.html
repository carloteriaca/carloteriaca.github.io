<html lang="it">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<a class="skip" href="#main">Vai al contenuto</a>

<header class="topbar">
  <div class="wrap topbar__inner">
    <span class="brand">Carlo Teriaca</span>
    <nav class="nav" aria-label="Principale">
      <a href="index.html">Chi sono</a>
      <a href="archivio.html" aria-current="page">Archivio</a>
    </nav>
  </div>
</header>

<main id="main">
  <div class="wrap">

    <header class="page-head">
      <p class="label">Lavori conclusi</p>
      <h1>Archivio</h1>
      <p>I lavori finiti. Scegli l'anno, poi la raccolta.</p>
    </header>

    <!-- I pulsanti degli anni si creano da soli, uno per ogni <section class="year">. -->
    <div class="years" role="group" aria-label="Scegli l'anno" id="anni"></div>

    <!-- =================================================================
         COME FUNZIONA
         Anno, poi raccolte, poi lavori.
         Nuovo anno:     copia un blocco <section class="year"> e cambia data-year.
                         Metti gli anni dal più recente al più vecchio.
         Nuova raccolta: dentro l'anno copia un blocco <a class="card">
                         e crea la sua pagina nella cartella archivio/
                         (copia isia-design-del-prodotto-2.html).
         ================================================================= -->

    <section class="year" data-year="2026" aria-label="2026">
      <div class="grid grid--2">
        <a class="card" href="archivio/isia-design-del-prodotto-2.html">
          <div class="card__media"><img src="assets/archivio/anteprime/archicubo.jpg" alt="" loading="lazy"></div>
          <div class="card__body">
            <p class="label">ISIA Roma</p>
            <h3>Design del Prodotto, anno 2</h3>
            <p>3 lavori: teoria della forma, comunicazione visiva, semiotica per il design.</p>
            <span class="card__cta">Apri la raccolta →</span>
          </div>
        </a>
      </div>
    </section>

  </div>
</main>

<footer class="footer">
  <div class="wrap footer__inner">
    <span>Carlo Teriaca</span>
    <nav aria-label="Canali">
      <a href="https://www.youtube.com/@carloteriaca_economia">YouTube · Economia</a>
      <!-- <a href="LINK_CANALE_EDITOR">YouTube · Editing</a> -->
    </nav>
  </div>
</footer>

<script>
  // Crea un pulsante per ogni anno e mostra un anno alla volta.
  // Senza JavaScript tutti gli anni restano visibili, uno sotto l'altro.
  (function () {
    var years = Array.prototype.slice.call(document.querySelectorAll('.year'));
    var bar = document.getElementById('anni');
    if (!years.length || !bar) return;
    function show(y) {
      years.forEach(function (s) { s.hidden = s.dataset.year !== y; });
      Array.prototype.forEach.call(bar.children, function (b) {
        b.setAttribute('aria-pressed', b.dataset.year === y ? 'true' : 'false');
      });
    }
    years.forEach(function (s) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = s.dataset.year;
      b.dataset.year = s.dataset.year;
      b.addEventListener('click', function () { show(s.dataset.year); });
      bar.appendChild(b);
    });
    show(years[0].dataset.year);
  })();
</script>

</body>
</html>
